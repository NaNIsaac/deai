[project]
name = "uncredit"
version = "0.3.0"
description = "Find and remove AI co-author credits from git history"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
dependencies = []
keywords = ["git", "co-author", "ai", "history", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/uncredit"
Repository = "https://github.com/NaNIsaac/uncredit"
Issues = "https://github.com/NaNIsaac/uncredit/issues"

[project.scripts]
uncredit = "uncredit.cli:main"
deai = "uncredit.cli:legacy_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncredit"]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"src/uncredit/cli.py" = ["PLW1510"]
"tests/test_uncredit.py" = ["RUF100"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
