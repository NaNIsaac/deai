[project]
name = "git-deai"
version = "0.3.0"
description = "Compatibility command for uncredit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["uncredit>=0.3.0"]

[project.urls]
Homepage = "https://github.com/NaNIsaac/uncredit"

[project.scripts]
deai = "git_deai_legacy:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_deai_legacy"]
